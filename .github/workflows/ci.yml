name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install -e . pytest ruff mypy
      - run: .venv/bin/ruff format --check . && .venv/bin/ruff check .
      - run: .venv/bin/mypy
      - run: .venv/bin/pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t pwnedkeep .
      # two real ranges from the public API, served, and compared with it byte for byte
      - run: |
          docker volume create data
          docker run --rm -v data:/data pwnedkeep download /data/sha1.pwnd --prefixes 5BAA6,21BD1
          docker run -d --name pwnedkeep -p 8000:8000 -v data:/data pwnedkeep
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          for prefix in 5BAA6 21BD1; do
            cmp <(curl -s https://api.pwnedpasswords.com/range/$prefix) <(curl -s http://127.0.0.1:8000/range/$prefix)
          done
